version: 2

models:
  - name: stg_price_paid
    description: "Cleaned Land Registry price paid transactions, one row per sale."
    columns:
      - name: transaction_id
        description: "Unique identifier for each property transaction."
        data_tests:
          - not_null
          - unique
      - name: price
        description: "Sale price in GBP."
        data_tests:
          - not_null
      - name: transfer_date
        description: "Date the sale was completed."
        data_tests:
          - not_null
      - name: property_type
        description: "D=Detached, S=Semi, T=Terraced, F=Flat, O=Other."
        data_tests:
          - accepted_values:
              arguments:
                values: ['D', 'S', 'T', 'F', 'O']
      - name: old_or_new
        description: "Y=new build, N=established."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Y', 'N']